name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  gate:
    name: Invariant gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # No install needed — the gate has zero dependencies on purpose,
      # so it cannot be broken by a dependency change.
      - name: Invariants
        run: node tools/check-invariants.mjs

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
