packages:
  - "apps/*"
  - "packages/*"

# pnpm 10 does not run dependency install scripts unless they are listed
# here. Skia's postinstall downloads its prebuilt native binaries; without
# it the package installs but libskia.a never arrives, and the Android
# build fails at the CMake step with "Skia prebuilt binaries not found".
# The install succeeds either way — the failure is 20 minutes downstream,
# in a cloud build, which is why the warning is easy to scroll past.
onlyBuiltDependencies:
  - '@shopify/react-native-skia'
